# Conference talks, podcasts and livestreams.
# Order doesn't matter; the site sorts by date, newest first.
# The homepage shows the latest few and links to /talks once the list outgrows it.
#
# - id: unique-slug
#   title: Talk or episode title
#   event: Conference, show or channel
#   kind: talk          # talk | podcast | livestream | panel | workshop
#   date: 2026-05       # year-month is enough; may be omitted only while draft
#   with: Host name     # optional
#   url: https://...    # optional main link
#   links:              # optional extra links
#     - { label: YouTube, url: https://... }
#   draft: true         # hidden on the live site

